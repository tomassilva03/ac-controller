name: build

# Cada push para main gera uma versão nova (0.1.<número do build>), publicada nas
# Releases. A app instalada vê-a e atualiza-se sozinha.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release_id: ${{ steps.r.outputs.id }}
    steps:
      - id: v
        run: echo "version=0.1.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
      - id: r
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          id=$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases" \
            -f tag_name="v$VERSION" -f target_commitish="$GITHUB_SHA" \
            -f name="AC Controller $VERSION" -F draft=true -F generate_release_notes=true --jq .id)
          test -n "$id"
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Pôr a versão
        shell: bash
        run: |
          node -e "const f='src-tauri/tauri.conf.json';const c=require('./'+f);c.version='${{ needs.release.outputs.version }}';require('fs').writeFileSync(f,JSON.stringify(c,null,2)+'\n')"
      - name: Testar e compilar o hon-bridge
        run: |
          python -m pip install -r bridge/requirements.txt pytest
          python -m pytest -q bridge/tests
          python bridge/build.py
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.release.outputs.release_id }}
          includeUpdaterJson: true

      # A app do Mac tem de sair com uma assinatura válida (ad-hoc), senão o
      # macOS diz que está "danificada" quando é descarregada.
      - if: runner.os == 'macOS'
        run: |
          codesign --verify --deep --strict --verbose=2 src-tauri/target/release/bundle/macos/*.app
          # O hon-bridge dentro da app tem de arrancar e responder.
          echo '{"id":1,"cmd":"ping"}' | src-tauri/target/release/bundle/macos/*.app/Contents/MacOS/hon-bridge | grep -q pong

  publish:
    needs: [release, build]
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        # Só publica se o latest.json (que a app usa para se atualizar) foi enviado.
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases/${{ needs.release.outputs.release_id }}/assets" --jq '.[].name' | tee assets.txt
          grep -qx latest.json assets.txt
          gh release edit "v${{ needs.release.outputs.version }}" --repo "$GITHUB_REPOSITORY" --draft=false --latest
