name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            bundle: src-tauri/target/release/bundle/dmg/*.dmg
          - os: windows-latest
            bundle: src-tauri/target/release/bundle/msi/*.msi
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Testar e compilar o hon-bridge
        run: |
          python -m pip install -r bridge/requirements.txt pytest
          python -m pytest -q bridge/tests
          python bridge/build.py
      - run: npm ci
      - run: npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: ac-controller-${{ matrix.os }}
          path: ${{ matrix.bundle }}
